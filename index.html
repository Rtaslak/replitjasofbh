    <!-- Emergency fix for auth loops -->
    <script>
      // This is a safety measure to prevent infinite loops
      (function() {
        // Only run this on the auth page
        if (window.location.pathname.includes('/auth')) {
          // Check if we have auth tokens
          const hasToken = 
            (window.sessionStorage && window.sessionStorage.getItem('accessToken')) || 
            (window.localStorage && window.localStorage.getItem('accessToken'));
          
          if (hasToken) {
            console.log("💥 LOOP BREAKER: Detected auth tokens on auth page. Forcing redirect to dashboard.");
            window.location.href = '/dashboard';
          }
        }
      })();
    </script>
